# Copy to docker-compose.yml. Only the port and the volume are needed:
# open http://<host>:8585 and enter Radarr, Sonarr, Plex, TMDB and Claude in
# the web UI. Environment variables below are optional; a variable that is set
# locks that field in the UI.
services:
  proposarr:
    image: leander1999/proposarr:latest
    container_name: proposarr
    restart: unless-stopped
    ports:
      - "8585:8585"
    volumes:
      - ./config:/config
    environment:
      TZ: Etc/UTC
      # Owner of ./config on the host (Unraid: 99 and 100).
      PUID: "1000"
      PGID: "1000"
      # Optional overrides, normally entered in the web UI instead:
      # CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # PROPOSARR_RADARR_URL: http://radarr:7878
      # PROPOSARR_SONARR_URL: http://sonarr:8989
      # PROPOSARR_WEB_USERNAME: admin
      # PROPOSARR_WEB_PASSWORD: change-me
