# Proposarr configuration. Copy to proposarr.yaml and fill in.
# Every key can also be set with an environment variable (see README);
# environment variables win over this file.

# Where snapshots and run data are kept.
data_dir: data
# Watch-history window in days.
history_days: 180
# How long the Sonarr/Radarr library snapshot is reused before refetching.
snapshot_ttl: 6h

# Required for series.
sonarr:
  url: http://sonarr:8989
  api_key: your-sonarr-api-key
  # Optional. When empty and Sonarr has several root folders, you are asked per title.
  root_folder: ""

# Required for movies.
radarr:
  url: http://radarr:7878
  api_key: your-radarr-api-key
  # Optional. When empty and Radarr has several root folders, you are asked per title.
  root_folder: ""
  # announced, inCinemas or released.
  minimum_availability: released

# Optional. Configure Plex or Jellyfin to use watch history as the taste signal.
plex:
  url: ""   # e.g. http://plex:32400
  token: ""

# Optional.
jellyfin:
  url: ""      # e.g. http://jellyfin:8096
  api_key: ""
  user_id: ""  # empty merges every user's history

# Required.
tmdb:
  api_key: your-tmdb-api-key  # v3 API key or v4 read access token
  region: US                  # region for streaming availability

claude:
  bin: claude
  # Set at most one. Leave both empty to use the claude CLI's own login.
  oauth_token: ""  # from `claude setup-token`
  api_key: ""      # an Anthropic API key
  timeout: 10m
  # Optional spend cap per run in USD, 0 for none.
  max_budget_usd: 0

movies:
  model: claude-sonnet-5
  effort: medium       # low, medium, high, xhigh, max
  picks: 10            # picks per run
  candidates: 150      # candidate list cap sent to the model
  free_picks: 3        # picks allowed outside the candidate list
  seeds: 15            # profile titles used to fetch TMDB recommendations
  top_titles: 40       # profile titles shown to the model

series:
  model: claude-sonnet-5
  effort: medium
  picks: 10
  candidates: 150
  free_picks: 3
  seeds: 15
  top_titles: 40
